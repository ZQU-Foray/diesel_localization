# 哨兵：Livox 点云 + point_lio 里程计，独立 GICP 校正。
foray_map_server:
  ros__parameters:
    publish_rate_hz: 1.0
    verify_map_hashes: true

foray_localization:
  ros__parameters:
    map_frame: map
    odom_frame: odom
    base_frame: base_footprint
    pose_source: auto
    cloud_topic: /livox/lidar
    odom_topic: /aft_mapped_to_init
    external_pose_topic: /localization/external_pose
    state_rate_hz: 50.0
    tf_rate_hz: 20.0
    align_rate_hz: 5.0
    obstacle_rate_hz: 10.0
    voxel_leaf_m: 0.10
    map_voxel_leaf_m: 0.25
    align_max_iterations: 10
    align_max_correspondence_m: 0.50
    residual_threshold_m: 0.30
    cluster_tolerance_m: 0.30
    min_cluster_size: 5
    max_cluster_size: 500
    ok_mean_residual_m: 0.15
    degraded_mean_residual_m: 0.30
    ok_inlier_ratio: 0.55
    degraded_inlier_ratio: 0.35
    lost_timeout_sec: 1.0
    odom_timeout_sec: 0.5
    lidar_timeout_sec: 0.2
    warmup_frames: 3
    recover_frames: 3
    fov_horizontal_deg: 30.0
    fov_vertical_deg: 180.0
    fov_center_yaw_deg: 0.0
    observability_ratio_threshold: 0.05
    # 100：仿真实测 30° 视场 + 0.10 m 体素后只剩 64~70 点（审计 L7），GICP 报「无有效对应」
    # 却仍输出位姿。点数是「约束够不够撑起 6 个自由度」的第一道可得证据，
    # 低于这个量就该在消息层显示降级，而不是等对齐失败才在日志里出现（decision.md D58）。
    min_source_points: 100
    # 3 而不是默认的 6：6 等于 kDofCount，即「六个方向全不可观也算可观」（审计 L5）。
    # 实测配准退化 5/6 方向不可观（condition≈1e10、点面约束 65~68）时位姿照常输出，
    # 说明这条判据当时是关的。钉在 3 表示超过半数方向不可观就降级（decision.md D58）。
    max_unobservable_dofs: 3
    profile_enabled: false
    filter_enabled: false
    filter_measurement_noise_m: 0.05
    filter_unobservable_noise_scale: 10.0
